---
controller_credentials_demo:
  - name: aap
    credential_type: Red Hat Ansible Automation Platform
    organization: ray
    description: AAP admin credential
    inputs:
      host: "{{ lookup('ansible.builtin.env', 'CONTROLLER_HOST') }}"
      username: "{{ lookup('ansible.builtin.env', 'CONTROLLER_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'CONTROLLER_PASSWORD') }}"
      verify_ssl: "{{ lookup('ansible.builtin.env', 'CONTROLLER_VERIFY_SSL') | bool }}"

  - name: openshift
    credential_type: OpenShift or Kubernetes API Bearer Token
    organization: ray
    description: OpenShift API credential
    inputs:
      host: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_HOST') }}"
      bearer_token: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_API_KEY') }}"
      verify_ssl: "{{ lookup('ansible.builtin.env', 'K8S_AUTH_VERIFY_SSL') | bool }}"

  - name: git
    credential_type: Source Control
    organization: ray
    description: Git credential
    inputs:
      username: "{{ lookup('ansible.builtin.env', 'GIT_USERNAME') }}"
      password: "{{ lookup('ansible.builtin.env', 'GIT_PASSWORD') }}"
